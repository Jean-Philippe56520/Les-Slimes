name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dashboard,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src dashboard streamlit_app.py

      - name: Run test suite
        run: python -m pytest

      - name: Streamlit smoke test
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            > /tmp/les-slimes-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/les-slimes-streamlit.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/les-slimes-streamlit.log
          exit 1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag les-slimes:ci .
