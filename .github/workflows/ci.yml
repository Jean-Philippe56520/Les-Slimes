name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dashboard,api,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src dashboard streamlit_app.py

      - name: Run test suite
        run: python -m pytest

      - name: Streamlit smoke test
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            > /tmp/les-slimes-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/les-slimes-streamlit.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/les-slimes-streamlit.log
          exit 1

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slimes
          POSTGRES_PASSWORD: slimes_ci
          POSTGRES_DB: les_slimes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slimes -d les_slimes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LES_SLIMES_TEST_POSTGRES_URL: postgresql://slimes:slimes_ci@127.0.0.1:5432/les_slimes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,postgres,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run PostgreSQL integration suite
        run: python -m pytest tests/test_postgres_backend.py tests/test_postgres_experiment_fork.py -vv

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, postgres]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag les-slimes:ci .
